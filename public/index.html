<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cryptopayQR</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#11151c;color:#f7f4eb;font:16px system-ui;display:flex;justify-content:center}.app{width:min(560px,100%);padding:28px 20px}.brand{color:#e6bf45;letter-spacing:.14em;font-weight:700}.card{background:#1d2632;border-radius:20px;padding:24px;margin-top:24px}button{width:100%;border:0;border-radius:14px;padding:16px;background:#e6bf45;font-weight:700;font-size:16px;margin-top:12px}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #46505e;background:#11151c;color:white;margin:14px 0}.muted{color:#aeb7c4;font-size:14px}video{width:100%;border-radius:14px;display:none}</style></head><body><main class="app"><div class="brand">cryptopayQR</div><h1>Оплата по QR</h1><p class="muted">Отсканируйте QR-код магазина. Сумма будет взята из реквизитов платежа.</p><section class="card"><video id="camera" playsinline></video><button id="scan">Сканировать QR</button><label>Или вставьте строку QR</label><input id="payload" placeholder="https://qr.nspk.ru/..."><button id="parse">Разобрать QR</button><div id="details"></div><label>Сеть USDT</label><select id="network"><option value="TRC20">TRC20 (TRON)</option><option value="BEP20">BEP20 (BNB Smart Chain)</option></select><button id="quote" hidden>Рассчитать сумму USDT</button><div id="quoteResult"></div><button id="pay" hidden>Создать тестовый платёж</button><p id="result"></p></section></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=id=>document.getElementById(id);let parsed=null;function parsePayload(raw){const u=(()=>{try{return new URL(raw)}catch{return null}})();let amount=null;if(u){amount=u.searchParams.get('sum')||u.searchParams.get('amount');if(amount)amount=Number(amount)/((u.searchParams.get('sum')||'').length>3?100:1)}if(!amount){const m=raw.match(/(?:sum|amount)[=:](\d+(?:\.\d+)?)/i);if(m)amount=Number(m[1])/(m[1].length>3?100:1)}return amount&&amount>0?{amountRub:Math.round(amount*100)/100,raw}:null}function show(p){parsed=p;if(!p){$('details').textContent='Не удалось найти сумму в QR';$('pay').hidden=true;return}$('details').textContent='Сумма к оплате: '+p.amountRub.toFixed(2)+' ₽';$('pay').hidden=false}$('parse').onclick=()=>show(parsePayload($('payload').value.trim()));$('scan').onclick=async()=>{if(!('BarcodeDetector' in window)){ $('result').textContent='Камера недоступна в этом браузере. Вставьте данные QR вручную.';return}const v=$('camera');v.style.display='block';const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;await v.play();const d=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{const codes=await d.detect(v);if(codes[0]){s.getTracks().forEach(t=>t.stop());v.style.display='none';$('payload').value=codes[0].rawValue;show(parsePayload(codes[0].rawValue));}else requestAnimationFrame(loop)};loop()};$('pay').onclick=async()=>{const r=$('result');r.textContent='Создаём тестовый заказ…';const x=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':tg?.initData||''},body:JSON.stringify({amountRub:parsed.amountRub})});const d=await x.json();r.textContent=x.ok?'Заказ создан: '+d.orderId+' (тестовый режим)':(d.error||'Ошибка авторизации')};</script></body></html>
